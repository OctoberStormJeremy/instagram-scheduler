version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instagram_scheduler
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build: .
    command: pnpm --filter api dev
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/instagram_scheduler
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: pnpm --filter worker dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/instagram_scheduler
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
